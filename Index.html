<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OBED AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202123;
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    /* APP */

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      background: #f7f7f8;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      padding: 10px;
    }

    .new-chat {
      border: 1px solid #d9d9d9;
      background: white;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 20px;
    }

    .new-chat:hover {
      background: #eeeeee;
    }

    .recent-title {
      font-size: 13px;
      color: #777;
      margin: 5px 10px 10px;
    }

    .recent-list {
      flex: 1;
      overflow-y: auto;
    }

    .recent-item {
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-item:hover {
      background: #e9e9e9;
    }

    .profile {
      border-top: 1px solid #ddd;
      padding-top: 12px;
      margin-top: 10px;
      cursor: pointer;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .topbar-title {
      font-weight: bold;
      font-size: 18px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
    }

    .icon-btn:hover {
      background: #eeeeee;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15%;
    }

    .welcome {
      text-align: center;
      margin-top: 12vh;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #777;
      font-size: 15px;
    }

    .message {
      margin: 18px 0;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #eeeeee;
    }

    .assistant .bubble {
      background: transparent;
    }

    /* INPUT */

    .composer-area {
      padding: 12px 15%;
      border-top: 1px solid #eee;
    }

    .tools {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      border: 1px solid #ddd;
      background: white;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .tool-btn:hover {
      background: #f2f2f2;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border: 1px solid #ccc;
      border-radius: 14px;
      padding: 8px;
      background: white;
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 160px;
      padding: 10px;
    }

    .send {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #111;
      color: white;
      font-size: 18px;
    }

    .send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 11px;
      margin-top: 7px;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 430px;
      border-radius: 15px;
      padding: 22px;
    }

    .modal-box h2 {
      margin-bottom: 15px;
    }

    .modal-box input,
    .modal-box select {
      width: 100%;
      padding: 11px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    /* MOBILE */

    .mobile-menu {
      display: none;
    }

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 30;
        transition: left 0.2s;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .chat {
        padding: 20px 12px;
      }

      .composer-area {
        padding: 10px;
      }

      .bubble {
        max-width: 90%;
      }

      .welcome {
        margin-top: 15vh;
      }

      .welcome h1 {
        font-size: 26px;
      }
    }

    /* DARK MODE */

    body.dark {
      background: #202123;
      color: #ffffff;
    }

    body.dark .sidebar {
      background: #171717;
      border-color: #333;
    }

    body.dark .topbar,
    body.dark .composer-area {
      border-color: #333;
    }

    body.dark .new-chat,
    body.dark .tool-btn,
    body.dark .composer,
    body.dark .modal-box {
      background: #2b2b2b;
      color: white;
      border-color: #444;
    }

    body.dark textarea {
      background: #2b2b2b;
      color: white;
    }

    body.dark .user .bubble {
      background: #343434;
    }

    body.dark .recent-item:hover,
    body.dark .icon-btn:hover,
    body.dark .new-chat:hover,
    body.dark .tool-btn:hover {
      background: #333;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      🤖 OBED AI
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="recent-title">
      RECENTS
    </div>

    <div class="recent-list" id="recentList"></div>

    <div class="profile" onclick="openProfile()">
      👤 Guest
    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="icon-btn mobile-menu"
        onclick="toggleSidebar()">
        ☰
      </button>

      <div class="topbar-title">
        OBED AI
      </div>

      <div class="top-actions">

        <button
          class="icon-btn"
          onclick="toggleDarkMode()"
          title="Dark mode">
          🌙
        </button>

        <button
          class="icon-btn"
          onclick="openSettings()"
          title="Settings">
          ⚙️
        </button>

      </div>

    </header>

    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <h1>🤖 Hello, I am OBED AI</h1>

        <p>
          Ask me anything. Ndashobora kugufasha mu Kirundi,
          Français, English n'izindi ndimi.
        </p>

      </div>

    </section>

    <!-- COMPOSER -->

    <div class="composer-area">

      <div class="tools">

        <button
          class="tool-btn"
          onclick="document.getElementById('fileInput').click()">
          📎 Document
        </button>

        <button
          class="tool-btn"
          onclick="document.getElementById('imageInput').click()">
          🖼️ Image
        </button>

        <button
          class="tool-btn"
          onclick="imageMode()">
          🎨 Create image
        </button>

        <button
          class="tool-btn"
          onclick="webMode()">
          🌐 Web search
        </button>

        <select
          id="language"
          class="tool-btn"
          onchange="changeLanguage()">

          <option value="auto">Auto language</option>
          <option value="rn">Kirundi</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="sw">Kiswahili</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>

        </select>

      </div>

      <input
        type="file"
        id="fileInput"
        hidden
        onchange="fileSelected(this)">

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
        onchange="imageSelected(this)">

      <div class="composer">

        <textarea
          id="messageInput"
          placeholder="Message OBED AI..."
          rows="1"
          onkeydown="handleKey(event)"></textarea>

        <button
          class="send"
          id="sendButton"
          onclick="sendMessage()">
          ↑
        </button>

      </div>

      <div class="footer">
        OBED AI can make mistakes. Verify important information.
      </div>

    </div>

  </main>

</div>

<!-- PROFILE MODAL -->

<div class="modal" id="profileModal">

  <div class="modal-box">

    <h2>👤 Your profile</h2>

    <input
      id="nameInput"
      placeholder="Your name">

    <input
      id="schoolInput"
      placeholder="School / University">

    <input
      id="levelInput"
      placeholder="Your class / level">

    <div class="modal-buttons">

      <button onclick="closeProfile()">
        Cancel
      </button>

      <button onclick="saveProfile()">
        Save
      </button>

    </div>

  </div>

</div>

<!-- SETTINGS MODAL -->

<div class="modal" id="settingsModal">

  <div class="modal-box">

    <h2>⚙️ Settings</h2>

    <select id="defaultLanguage">

      <option value="auto">Automatic language</option>
      <option value="rn">Kirundi</option>
      <option value="fr">Français</option>
      <option value="en">English</option>

    </select>

    <div class="modal-buttons">

      <button onclick="closeSettings()">
        Close
      </button>

      <button onclick="saveSettings()">
        Save
      </button>

    </div>

  </div>

</div>

<script>

  const API_URL = "/api/chat";

  let conversationId = createId();

  let userId =
    localStorage.getItem("obed_user_id") || createId();

  localStorage.setItem("obed_user_id", userId);

  let useWeb = false;

  let imageCreationMode = false;

  let recents =
    JSON.parse(localStorage.getItem("obed_recents") || "[]");

  function createId() {

    return (
      Date.now().toString(36) +
      Math.random().toString(36).substring(2)
    );

  }

  function addMessage(role, text) {

    const chat = document.getElementById("chat");

    const welcome = document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }

    const message = document.createElement("div");

    message.className = "message " + role;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

  }

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const message =
      input.value.trim();

    if (!message) return;

    addMessage("user", message);

    input.value = "";

    button.disabled = true;

    addRecent(message);

    try {

      const response = await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: message,

          userId: userId,

          conversationId: conversationId,

          useWeb: useWeb

        })

      });

      const data = await response.json();

      if (data.reply) {

        addMessage("assistant", data.reply);

      } else {

        addMessage(
          "assistant",
          "OBED AI ntiyashoboye gusubiza ubu."
        );

      }

    } catch (error) {

      console.error(error);

      addMessage(
        "assistant",
        "Hari ikibazo co guhuza na OBED AI. Raba ko server iri online."
      );

    }

    button.disabled = false;

  }

  function handleKey(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }

  function newChat() {

    conversationId = createId();

    document.getElementById("chat").innerHTML = `

      <div class="welcome" id="welcome">

        <h1>🤖 OBED AI</h1>

        <p>
          New conversation started.
        </p>

      </div>

    `;

    useWeb = false;

    imageCreationMode = false;

    toggleSidebar(false);

  }

  function addRecent(message) {

    const title =
      message.length > 35
        ? message.substring(0, 35) + "..."
        : message;

    recents.unshift({

      id: conversationId,

      title: title

    });

    recents =
      recents.slice(0, 30);

    localStorage.setItem(
      "obed_recents",
      JSON.stringify(recents)
    );

    renderRecents();

  }

  function renderRecents() {

    const list =
      document.getElementById("recentList");

    list.innerHTML = "";

    recents.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "recent-item";

      div.textContent = item.title;

      div.onclick = () => {

        conversationId = item.id;

        loadHistory(item.id);

      };

      list.appendChild(div);

    });

  }

  async function loadHistory(id) {

    try {

      const response =
        await fetch(
          `/api/history/${userId}/${id}`
        );

      const data =
        await response.json();

      document.getElementById("chat").innerHTML = "";

      if (
        !data.messages ||
        data.messages.length === 0
      ) {

        newChat();

        return;

      }

      data.messages.forEach(message => {

        addMessage(
          message.role === "user"
            ? "user"
            : "assistant",
          typeof message.content === "string"
            ? message.content
            : JSON.stringify(message.content)
        );

      });

      toggleSidebar(false);

    } catch (error) {

      console.error(error);

    }

  }

  function imageMode() {

    imageCreationMode =
      !imageCreationMode;

    const input =
      document.getElementById("messageInput");

    if (imageCreationMode) {

      input.placeholder =
        "Describe the image you want OBED AI to create...";

      addMessage(
        "assistant",
        "🎨 Image mode is ready. Write your image prompt."
      );

    } else {

      input.placeholder =
        "Message OBED AI...";

    }

  }

  function webMode() {

    useWeb = !useWeb;

    addMessage(
      "assistant",
      useWeb
        ? "🌐 Web search activated."
        : "🌐 Web search deactivated."
    );

  }

  function fileSelected(input) {

    if (!input.files.length) return;

    const file = input.files[0];

    addMessage(
      "assistant",
      `📎 Document selected: ${file.name}\nDocument processing will be connected to the backend.`
    );

  }

  function imageSelected(input) {

    if (!input.files.length) return;

    const file = input.files[0];

    addMessage(
      "assistant",
      `🖼️ Image selected: ${file.name}\nImage analysis will be connected to the backend.`
    );

  }

  function toggleDarkMode() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
      "obed_dark",
      document.body.classList.contains("dark")
    );

  }

  function toggleSidebar(force) {

    const sidebar =
      document.getElementById("sidebar");

    if (typeof force === "boolean") {

      sidebar.classList.toggle(
        "open",
        force
      );

    } else {

      sidebar.classList.toggle("open");

    }

  }

  function openProfile() {

    document.getElementById(
      "profileModal"
    ).style.display = "flex";

  }

  function closeProfile() {

    document.getElementById(
      "profileModal"
    ).style.display = "none";

  }

  function saveProfile() {

    const profile = {

      name:
        document.getElementById("nameInput").value,

      school:
        document.getElementById("schoolInput").value,

      level:
        document.getElementById("levelInput").value

    };

    localStorage.setItem(
      "obed_profile",
      JSON.stringify(profile)
    );

    closeProfile();

  }

  function openSettings() {

    document.getElementById(
      "settingsModal"
    ).style.display = "flex";

  }

  function closeSettings() {

    document.getElementById(
      "settingsModal"
    ).style.display = "none";

  }

  function saveSettings() {

    const language =
      document.getElementById(
        "defaultLanguage"
      ).value;

    localStorage.setItem(
      "obed_language",
      language
    );

    closeSettings();

  }

  function changeLanguage() {

    const language =
      document.getElementById(
        "language"
      ).value;

    localStorage.setItem(
      "obed_language",
      language
    );

  }

  /* LOAD */

  renderRecents();

  if (
    localStorage.getItem("obed_dark") === "true"
  ) {

    document.body.classList.add("dark");

  }

  const savedProfile =
    JSON.parse(
      localStorage.getItem("obed_profile") || "null"
    );

  if (savedProfile) {

    document.querySelector(
      ".profile"
    ).textContent =
      "👤 " +
      (savedProfile.name || "Guest");

  }

</script>

</body>
      </html>
