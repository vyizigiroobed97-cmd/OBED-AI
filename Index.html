<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBED AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 230px;
      background: #202123;
      color: white;
      padding: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      background: #343541;
      color: white;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: white;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 15px auto;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .user {
      background: #e8e8e8;
    }

    .ai {
      background: white;
      border: 1px solid #ddd;
    }

    .input-area {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #sendButton {
      margin-left: 10px;
      padding: 14px 20px;
      background: #111827;
      color: white;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <aside class="sidebar">
      <div class="logo">🤖 OBED AI</div>

      <button class="new-chat" onclick="newChat()">
        + New Chat
      </button>

      <div>Chat History</div>
    </aside>

    <main class="main">

      <div class="topbar">
        OBED AI
      </div>

      <div class="chat" id="chat">

        <div class="message ai">
          <strong>OBED AI:</strong><br>
          Hello! I am OBED AI 🤖. Ask me anything.
        </div>

      </div>

      <div class="input-area">

        <input
          id="messageInput"
          type="text"
          placeholder="Message OBED AI..."
        >

        <button id="sendButton" onclick="sendMessage()">
          Send
        </button>

      </div>

    </main>

  </div>


  <script>

    async function sendMessage() {

      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (!message) return;

      // Show user's message
      chat.innerHTML += `
        <div class="message user">
          <strong>You:</strong><br>
          ${message}
        </div>
      `;

      input.value = "";

      // Temporary loading message
      const loading = document.createElement("div");
      loading.className = "message ai";
      loading.innerHTML = "<strong>OBED AI:</strong><br>Thinking... 🤔";
      chat.appendChild(loading);

      try {

        const response = await fetch("http://localhost:3000/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        loading.innerHTML = `
          <strong>OBED AI:</strong><br>
          ${data.reply || data.error}
        `;

      } catch (error) {

        loading.innerHTML = `
          <strong>OBED AI:</strong><br>
          Server ntiraboneka. 🤖
        `;

      }

      chat.scrollTop = chat.scrollHeight;
    }


    function newChat() {
      document.getElementById("chat").innerHTML = `
        <div class="message ai">
          <strong>OBED AI:</strong><br>
          New chat yatanguye. 🤖
        </div>
      `;
    }


    document.getElementById("messageInput").addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
